services:
  studio:
    image: ${STUDIO_IMAGE:-ghcr.io/coronaaustralis/scrcpy-studio:latest}
    build: .
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      HTTPS: ${HTTPS:-false}
      TLS_HOSTS: ${TLS_HOSTS:-localhost,127.0.0.1,::1}
      STUDIO_USER: ${STUDIO_USER:-admin}
      STUDIO_PASSWORD: ${STUDIO_PASSWORD:-}
    volumes:
      - adb-keys:/home/node/.android
      - tls-certs:/home/node/.tls
volumes:
  adb-keys:
  tls-certs:
