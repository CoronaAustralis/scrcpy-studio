services:
  studio:
    image: ${STUDIO_IMAGE:-scrcpy-studio:local}
    build: .
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "${STUDIO_BIND:-127.0.0.1}:${STUDIO_PORT:-8787}:8787"
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      STUDIO_USER: ${STUDIO_USER:-admin}
      STUDIO_PASSWORD: ${STUDIO_PASSWORD:-}
    volumes:
      - adb-keys:/home/node/.android
volumes:
  adb-keys:
